<!DOCTYPE html>
<html>
<head>
<title>Contact | Namaste Tech</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;font-family:Segoe UI;background:#0f172a;color:#e5e7eb;}
#bg{position:fixed;inset:0;z-index:-1;}
.container{
 max-width:600px;
 margin:80px auto;
 background:#111827;
 padding:30px;
 border-radius:16px;
}
input,textarea{
 width:100%;
 padding:10px;
 margin:8px 0;
 border-radius:8px;
 border:none;
}
button{
 background:#00baf2;
 border:none;
 padding:10px 15px;
 border-radius:8px;
 color:white;
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div style="position:relative;z-index:1;">
<div class="container">
 <h2>📞 Contact Us</h2>
 <p>Address: 123 Tech Street, India</p>
 <p>Phone: +91 9876543210</p>
 <p>Email: support@namastetech.com</p>

 <input placeholder="Your Name">
 <input placeholder="Email">
 <textarea rows="4" placeholder="Message"></textarea>
 <button onclick="alert('Message Sent (Dummy) ✅')">Send</button>
</div>
</div>

<script>
const c=document.getElementById("bg"),x=c.getContext("2d");
let w,h;function r(){w=c.width=innerWidth;h=c.height=innerHeight}
addEventListener("resize",r);r();
let p=Array.from({length:60},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5}));
(function a(){
 x.clearRect(0,0,w,h);
 p.forEach(o=>{
  o.x+=o.vx;o.y+=o.vy;
  x.fillStyle="rgba(255,255,255,.6)";
  x.beginPath();x.arc(o.x,o.y,2,0,Math.PI*2);x.fill();
 });
 requestAnimationFrame(a);
})();
</script>

</body>
</html>
