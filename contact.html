<!DOCTYPE html>
<html>
<head>
<title>Contact | Namaste Tech</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
 margin:0;
 font-family:Segoe UI;
 background:#f4f6f8;
}
.container{
 max-width:700px;
 margin:auto;
 padding:40px;
}
.card{
 background:white;
 padding:30px;
 border-radius:15px;
 box-shadow:0 15px 30px rgba(0,0,0,.1);
}
input,textarea{
 width:100%;
 padding:10px;
 margin:8px 0;
}
button{
 background:#ff5722;
 color:white;
 border:none;
 padding:10px 15px;
 border-radius:8px;
}
</style>
</head>

<body>

<div class="container">
 <div class="card">
  <h2>📞 Contact Us</h2>
  <p><b>Address:</b> 123, Tech Street, New Delhi</p>
  <p><b>Phone:</b> +91 98765 43210</p>
  <p><b>Email:</b> support@namastetech.com</p>

  <h3>Send Message</h3>
  <input placeholder="Your Name">
  <input placeholder="Email">
  <textarea rows="4" placeholder="Message"></textarea>
  <button onclick="alert('Message Sent (Dummy) ✅')">Submit</button>
 </div>
</div>
 body{
 margin:0;
 font-family:Segoe UI, sans-serif;
 background:#0f172a;
 color:#e5e7eb;
 overflow-x:hidden;
}

#bg {
 position:fixed;
 inset:0;
 z-index:-1;
}


</body>
</html>
