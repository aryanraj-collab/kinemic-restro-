<!DOCTYPE html>
<html>
<head>
<title>Paytm Secure Payment</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
 margin:0;
 font-family:Segoe UI;
 background:#e6f7ff;
}
.paytm{
 max-width:420px;
 margin:80px auto;
 background:white;
 border-radius:22px;
 box-shadow:0 25px 50px rgba(0,0,0,.2);
 overflow:hidden;
}
.header{
 background:#00baf2;
 color:white;
 padding:25px;
 text-align:center;
}
.body{
 padding:25px;
}
input{
 width:100%;
 padding:12px;
 margin:12px 0;
 border-radius:10px;
 border:1px solid #ccc;
}
button{
 width:100%;
 padding:14px;
 background:#00baf2;
 color:white;
 border:none;
 border-radius:12px;
 font-size:16px;
 cursor:pointer;
}
.success{
 text-align:center;
 color:green;
 font-weight:bold;
 margin-top:15px;
}
</style>
</head>

<body>

<div class="paytm">
 <div class="header">
  <h2>Paytm</h2>
  <p>Amount to Pay: ₹<span id="amt"></span></p>
 </div>

 <div class="body">
  <input placeholder="Mobile Number">
  <input type="password" placeholder="UPI / Wallet PIN">
  <button onclick="pay()">Pay Now</button>
  <div class="success" id="msg"></div>
 </div>
</div>

<script>
amt.innerText = localStorage.total;

function pay(){
 msg.innerText = "Payment Successful ✅";
 localStorage.cart = "[]";
}
</script>

</body>
</html>
