<!DOCTYPE html>
<html>
<head>
<title>Cart | Namaste Tech</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
 margin:0;
 font-family:Segoe UI;
 background:#0b1220;
 color:#e5e7eb;
}
.container{
 max-width:700px;
 margin:80px auto;
 background:#111827;
 padding:30px;
 border-radius:20px;
}
li{
 display:flex;
 justify-content:space-between;
 padding:10px 0;
 border-bottom:1px solid #1f2933;
}
button{
 width:100%;
 margin-top:20px;
 padding:14px;
 background:#38bdf8;
 color:#0b1220;
 border:none;
 border-radius:12px;
 font-size:16px;
 font-weight:600;
 cursor:pointer;
}
</style>
</head>

<body>

<div class="container">
 <h2>🛒 Your Cart</h2>
 <ul id="list"></ul>
 <h3>Total: ₹<span id="total"></span></h3>
 <button onclick="goPay()">Proceed to Paytm</button>
</div>

<script>
let cart = JSON.parse(localStorage.cart || "[]");
let total = 0;
const list = document.getElementById("list");

cart.forEach(i=>{
 total += i.p;
 list.innerHTML += `<li>${i.n}<span>₹${i.p}</span></li>`;
});

total.innerText = total;

function goPay(){
 if(total===0) return alert("Cart is empty");
 localStorage.total = total;
 location.href="paytm.html";
}
</script>

</body>
</html>
