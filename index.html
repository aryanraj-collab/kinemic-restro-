<!DOCTYPE html>
<html>
<head>
<title>Namaste Tech | Menu</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
 margin:0;
 font-family:Segoe UI;
 background:linear-gradient(-45deg,#ff9800,#ff5722,#ffc107);
 background-size:400% 400%;
 animation:bg 10s infinite;
}
@keyframes bg{
 0%{background-position:0% 50%}
 50%{background-position:100% 50%}
 100%{background-position:0% 50%}
}
header{
 padding:20px;
 color:white;
 display:flex;
 justify-content:space-between;
}
.container{
 max-width:1100px;
 margin:auto;
 padding:30px;
}
.menu{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
 gap:20px;
}
.card{
 background:white;
 border-radius:16px;
 overflow:hidden;
 box-shadow:0 15px 30px rgba(0,0,0,.2);
}
.card img{
 width:100%;
 height:180px;
 object-fit:cover;
}
.info{
 padding:15px;
}
button{
 background:#ff5722;
 color:white;
 border:none;
 padding:10px 14px;
 border-radius:8px;
 cursor:pointer;
}
a{color:white;text-decoration:none;margin-left:15px;}
</style>
</head>

<body>

<header>
 <h1>🙏 Namaste Tech</h1>
 <div>
  <a href="cart.html">🛒 Cart</a>
  <a href="contact.html">Contact</a>
 </div>
</header>

<div class="container">
 <div class="menu" id="menu"></div>
</div>

<script>
let items=[
 {n:"Pizza",p:300,img:"https://images.unsplash.com/photo-1604382355076-af4b0eb60143"},
 {n:"Burger",p:400,img:"https://images.unsplash.com/photo-1550547660-d9450f859349"},
 {n:"Samosa",p:50,img:"https://images.unsplash.com/photo-1601050690597-df0568f70950"},
 {n:"Paneer Paratha",p:80,img:"https://images.unsplash.com/photo-1666001120894-d2e16d8a5bc3"}
];

let cart=JSON.parse(localStorage.cart||"[]");
let menu=document.getElementById("menu");

items.forEach(i=>{
 menu.innerHTML+=`
 <div class="card">
  <img src="${i.img}">
  <div class="info">
   <h3>${i.n}</h3>
   <p>₹${i.p}</p>
   <button onclick='add("${i.n}",${i.p})'>Add to Cart</button>
  </div>
 </div>`;
});

function add(n,p){
 cart.push({n,p});
 localStorage.cart=JSON.stringify(cart);
 alert("Added to cart ✅");
}
</script>

</body>
</html>
