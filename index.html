<!DOCTYPE html>
<html>
<head>
<title>Namaste Tech | Food Ordering</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
 margin:0;
 font-family:Segoe UI, sans-serif;
 background:#0b1220;
 color:#e5e7eb;
}
header{
 padding:20px 40px;
 display:flex;
 justify-content:space-between;
 align-items:center;
}
a{color:#38bdf8;text-decoration:none;margin-left:20px}
.hero{
 text-align:center;
 padding:60px 20px;
}
.hero h1{font-size:42px}
.menu{
 max-width:1100px;
 margin:auto;
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
 gap:25px;
 padding:40px;
}
.card{
 background:#111827;
 border-radius:18px;
 overflow:hidden;
 box-shadow:0 20px 40px rgba(0,0,0,.4);
 transition:.4s;
}
.card:hover{transform:translateY(-8px)}
.card img{
 width:100%;
 height:180px;
 object-fit:cover;
}
.card .info{padding:18px}
button{
 background:#38bdf8;
 color:#0b1220;
 border:none;
 padding:10px 16px;
 border-radius:10px;
 cursor:pointer;
 font-weight:600;
}
</style>
</head>

<body>

<header>
 <h2>🙏 Namaste Tech</h2>
 <div>
  <a href="cart.html">🛒 Cart</a>
 </div>
</header>

<section class="hero">
 <h1>Delicious Food, Smart Ordering</h1>
 <p>Fast • Secure • Modern</p>
</section>

<section class="menu" id="menu"></section>

<script>
const items=[
 {n:"Pizza",p:300,img:"https://images.unsplash.com/photo-1604382355076-af4b0eb60143"},
 {n:"Burger",p:400,img:"https://images.unsplash.com/photo-1550547660-d9450f859349"},
 {n:"Samosa",p:50,img:"https://images.unsplash.com/photo-1601050690597-df0568f70950"},
 {n:"Paneer Paratha",p:80,img:"https://images.unsplash.com/photo-1666001120894-d2e16d8a5bc3"}
];

let cart = JSON.parse(localStorage.cart || "[]");
const menu = document.getElementById("menu");

items.forEach(i=>{
 menu.innerHTML+=`
 <div class="card">
  <img src="${i.img}">
  <div class="info">
   <h3>${i.n}</h3>
   <p>₹${i.p}</p>
   <button onclick="add('${i.n}',${i.p})">Add to Cart</button>
  </div>
 </div>`;
});

function add(n,p){
 cart.push({n,p});
 localStorage.cart = JSON.stringify(cart);
 alert("Added to cart ✅");
}
</script>

</body>
</html>
