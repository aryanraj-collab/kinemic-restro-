<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Namaste Tech | Smart Food Ordering</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #222;
    --accent: #ff5722;
}

body.dark {
    --bg: #121212;
    --card: #1f1f1f;
    --text: #f1f1f1;
}

body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: .4s;
}

header {
    background: linear-gradient(135deg, #ff9800, #ff5722);
    color: white;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 { margin: 0; }

.toggle {
    cursor: pointer;
    background: rgba(255,255,255,.2);
    padding: 8px 14px;
    border-radius: 20px;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 30px;
    animation: fade 1s ease;
}

@keyframes fade {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; }
}

.menu {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
    gap: 20px;
}

.card {
    background: var(--card);
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,.1);
    transition: transform .3s, box-shadow .3s;
}
.card:hover {
    transform: translateY(-8px);
    box-shadow: 0 20px 40px rgba(0,0,0,.15);
}

.price {
    font-weight: bold;
    font-size: 18px;
}

button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: .3s;
}
button:hover { opacity: .9; }

.cart {
    margin-top: 40px;
    background: var(--card);
    padding: 25px;
    border-radius: 14px;
}

.cart ul {
    list-style: none;
    padding: 0;
}

.cart li {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    align-items: center;
    justify-content: center;
}

.box {
    background: var(--card);
    padding: 25px;
    width: 350px;
    border-radius: 14px;
    animation: pop .4s ease;
}

@keyframes pop {
    from { transform: scale(.7); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

input {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 6px;
    border: 1px solid #ccc;
}

.admin {
    display: none;
    margin-top: 40px;
    background: var(--card);
    padding: 25px;
    border-radius: 14px;
}
</style>
</head>

<body>

<header>
    <h1>🙏 Namaste Tech</h1>
    <div>
        <span class="toggle" onclick="toggleDark()">🌙 Dark</span>
        <span class="toggle" onclick="openAdmin()">Admin</span>
    </div>
</header>

<div class="container">
    <h2>🍽️ Menu</h2>
    <div class="menu" id="menu"></div>

    <div class="cart">
        <h2>🛒 Cart</h2>
        <ul id="cartItems"></ul>
        <h3>Total: ₹<span id="total">0</span></h3>
        <button onclick="pay()">Pay with Paytm</button>
    </div>

    <div class="admin" id="adminPanel">
        <h2>🛠 Admin Panel</h2>
        <input id="itemName" placeholder="Item Name">
        <input id="itemPrice" placeholder="Price">
        <button onclick="addItem()">Add Item</button>
        <p id="adminMsg"></p>
    </div>
</div>

<div class="modal" id="loginModal">
    <div class="box">
        <h2>Admin Login</h2>
        <input id="user" placeholder="Username">
        <input id="pass" type="password" placeholder="Password">
        <button onclick="login()">Login</button>
    </div>
</div>

<script>
let items = [
    {name:"Pizza",price:300},
    {name:"Burger",price:400},
    {name:"Samosa",price:50},
    {name:"Paneer Paratha",price:80}
];

let cart=[], total=0;

function renderMenu(){
    let m=document.getElementById("menu");
    m.innerHTML="";
    items.forEach(i=>{
        m.innerHTML+=`
        <div class="card">
            <h3>${i.name}</h3>
            <p class="price">₹${i.price}</p>
            <button onclick="addCart('${i.name}',${i.price})">Add</button>
        </div>`;
    });
}

function addCart(n,p){
    cart.push({n,p});
    total+=p;
    document.getElementById("total").innerText=total;
    document.getElementById("cartItems").innerHTML+=
        `<li>${n}<span>₹${p}</span></li>`;
}

function pay(){
    if(total==0) return alert("Cart empty");
    alert("Payment Successful ✅");
    cart=[]; total=0;
    document.getElementById("cartItems").innerHTML="";
    document.getElementById("total").innerText=0;
}

function toggleDark(){
    document.body.classList.toggle("dark");
    localStorage.theme=document.body.classList.contains("dark");
}

if(localStorage.theme=="true") document.body.classList.add("dark");

function openAdmin(){
    document.getElementById("loginModal").style.display="flex";
}

function login(){
    if(user.value=="admin" && pass.value=="admin123"){
        loginModal.style.display="none";
        adminPanel.style.display="block";
    } else alert("Wrong credentials");
}

function addItem(){
    items.push({name:itemName.value,price:itemPrice.value});
    renderMenu();
    adminMsg.innerText="Item Added ✅";
}

renderMenu();
</script>

</body>
</html>
