<!DOCTYPE html>
<html>
<head>
<title>Paytm Payment</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
 body{
 margin:0;
 font-family:Segoe UI, sans-serif;
 background:#0f172a;
 color:#e5e7eb;
 overflow-x:hidden;
}

#bg {
 position:fixed;
 inset:0;
 z-index:-1;
}
body{
 margin:0;
 font-family:Segoe UI;
 background:#e8f7fd;
}
.paytm{
 max-width:400px;
 margin:80px auto;
 background:white;
 border-radius:18px;
 box-shadow:0 20px 40px rgba(0,0,0,.15);
 overflow:hidden;
}
.header{
 background:#00baf2;
 color:white;
 padding:20px;
 text-align:center;
}
.body{
 padding:25px;
}
input{
 width:100%;
 padding:12px;
 margin:10px 0;
 border-radius:8px;
 border:1px solid #ccc;
}
button{
 width:100%;
 padding:12px;
 background:#00baf2;
 color:white;
 border:none;
 border-radius:8px;
 font-size:16px;
 cursor:pointer;
}
.success{
 text-align:center;
 color:green;
 font-weight:bold;
 margin-top:15px;
}
</style>
</head>

<body>

<div class="paytm">
 <div class="header">
  <h2>Paytm Secure Payment</h2>
  <p>Amount: ₹<span id="amt"></span></p>
 </div>

 <div class="body">
  <input placeholder="Mobile Number">
  <input placeholder="UPI / Wallet PIN" type="password">
  <button onclick="pay()">Pay Now</button>
  <p class="success" id="msg"></p>
 </div>
</div>
 


<script>
document.getElementById("amt").innerText=localStorage.total;

function pay(){
 document.getElementById("msg").innerText="Payment Successful ✅";
 localStorage.cart="[]";
}
</script>

</body>
</html>
